# Default values for leafypaper.
# Override these with -f my-values.yaml or --set on `helm install`.

# Namespace the chart creates and installs into. The chart will install a
# Namespace object itself so you don't have to `kubectl create ns leafypaper`
# beforehand; disable that by setting namespace.create=false.
namespace:
  create: true
  name: leafypaper

# ── images ──────────────────────────────────────────────────────────────
# leafypaper-master is our own Deployment image. leafypaper-server extends
# itzg/minecraft-server with the patched paperclip jar baked in, so all of
# itzg's modpack / configuration ergonomics (PACKWIZ_URL, MODRINTH_*, plugin
# auto-install, etc.) work transparently. Tag `latest` + Always-pull means a
# fresh image is picked up on any pod restart.
image:
  master:
    repository: ghcr.io/leafdtk/leafypaper-master
    tag: latest
    pullPolicy: Always
  server:
    repository: ghcr.io/leafdtk/leafypaper-server
    tag: latest
    pullPolicy: Always
  pullSecrets: []

# ── master ──────────────────────────────────────────────────────────────
master:
  # Master is single-instance by design. State (chunk-ownership table) is
  # in-memory; running multiple masters would create split-brain.
  replicas: 1

  service:
    type: ClusterIP
    masterPort: 35353

  # The built-in proxy is what Minecraft clients connect to. Exposed via
  # LoadBalancer by default so a cloud LB gives you an external TCP entry.
  # Swap to NodePort or use a separate Ingress controller for TCP if your
  # cluster doesn't have a cloud LB.
  proxy:
    enabled: true
    type: LoadBalancer
    port: 25577

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  env: {}
  # Hotspot tuning via JVM system properties. Empty string means
  # "use the hard-coded default in the master jar". Set to override.
  hotspot:
    thresholdPlayers: ""           # default: 80
    releaseThresholdPlayers: ""    # default: thresholdPlayers / 2
    cooldownSeconds: ""            # default: 60
    releaseHoldSeconds: ""         # default: 30
    regionSizeChunks: ""           # default: 16
    dryRun: "false"                # ship live by default; flip to "true" to log-only
    # Explicit crowd-server pool (comma-separated). Leave blank for the
    # homogeneous scheduler that picks any pod by current load.
    crowdServers: ""

  jvm:
    opts: "-Xms1G -Xmx2G"

# ── game servers (extending itzg/minecraft-server) ─────────────────────
server:
  # StatefulSet replica count — each one becomes a "server" inside the
  # MultiPaper cluster. Scale up = more cluster capacity.
  replicas: 2

  service:
    # Headless service for stable pod DNS. Game servers don't expose to
    # the world directly — Minecraft clients connect via the master proxy.
    type: ClusterIP
    clusterIP: None

  # Per-pod PVC. Off by default: game-server state (worlds, player files,
  # level.dat) is owned by the master and synced on demand, so the local
  # /data dir is ephemeral cache. Flip enabled=true if you want plugin
  # configs / mod jars to persist across pod restarts on a given replica.
  persistence:
    enabled: false
    storageClass: ""
    size: 10Gi
    accessModes: [ReadWriteOnce]

  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 4
      memory: 6Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  # itzg uses MEMORY for both -Xms and -Xmx. Set this to roughly your
  # resources.requests.memory minus ~512Mi (for non-heap JVM overhead).
  memory: "2G"

  # RCON for `kubectl exec`-style console commands. itzg wires this up
  # for us when ENABLE_RCON=true (already set in the image).
  rcon:
    password: "leafd"

  # Modpack / mod / plugin install via itzg env vars. ANY of these can be
  # set; itzg uses them in priority order. Most useful for leafypaper:
  #
  #   packwiz.url      — http(s) URL to a packwiz manifest.toml
  #   modrinth.project — modrinth project ID (slug works too)
  #   modrinth.version — pin a specific version, otherwise latest
  #   plugins          — comma-separated list of plugin jar URLs
  #
  # See https://docker-minecraft-server.readthedocs.io/ for the full menu.
  modpack:
    packwiz:
      url: ""        # e.g. "https://example.com/pack/pack.toml"
    modrinth:
      project: ""
      version: ""
    plugins: ""      # comma-separated jar URLs
    spigetResources: ""  # comma-separated SpigotMC resource IDs
    overrideConfigs: false  # itzg OVERRIDE_SERVER_PROPERTIES, useful with packwiz

  # Pass-through env vars for any itzg setting we haven't surfaced
  # explicitly. Example: MOTD, ICON, MAX_PLAYERS, VIEW_DISTANCE, etc.
  env: {}

  # Settings the chart can drop into the multipaper.yml — leave blank to
  # use the image's bundled defaults.
  multipaper:
    peerConnection:
      compressionThreshold: ""    # default: 256
      consolidationDelay: ""      # default: 0
      separateBulkChannel: ""     # default: false

  # JVM -D flags for hotspot reporter / hot-path tuning on game servers.
  hotspotReporter:
    regionSizeChunks: ""          # default: 16 (must match master)
    reportIntervalTicks: ""       # default: 40

# ── pod scheduling knobs ────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
