apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "leafypaper.server.fullname" . }}
  namespace: {{ include "leafypaper.namespace" . }}
  labels:
    {{- include "leafypaper.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  serviceName: server
  replicas: {{ .Values.server.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "leafypaper.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.server.repository }}:{{ .Values.image.server.tag }}"
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          env:
            # POD_NAME → MultiPaper "my-name". StatefulSet ordinals give us
            # stable names across restarts so the master can keep its
            # per-server state consistent.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # itzg memory + RCON wiring.
            - name: MEMORY
              value: {{ .Values.server.memory | quote }}
            - name: RCON_PASSWORD
              value: {{ .Values.server.rcon.password | quote }}
            # Pass leafypaper's -D flags through itzg's JVM_DD_OPTS. itzg
            # converts each `k=v` token into a `-Dk=v` JVM argument when
            # constructing the java command line. We always include the
            # multipaper.master-connection bits; hotspot reporter and
            # peerConnection knobs are appended only when set.
            - name: JVM_DD_OPTS
              value: {{ include "leafypaper.server.dd" . | quote }}
            # Modpack install hooks. Any empty env var is a no-op in itzg.
            {{- with .Values.server.modpack.packwiz.url }}
            - name: PACKWIZ_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.server.modpack.modrinth.project }}
            - name: MODRINTH_PROJECT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.server.modpack.modrinth.version }}
            - name: MODRINTH_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.server.modpack.plugins }}
            - name: PLUGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.server.modpack.spigetResources }}
            - name: SPIGET_RESOURCES
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.server.modpack.overrideConfigs }}
            - name: OVERRIDE_SERVER_PROPERTIES
              value: "TRUE"
            {{- end }}
            # Operator-provided pass-through (MOTD, MAX_PLAYERS, VIEW_DISTANCE, etc.).
            {{- range $k, $v := .Values.server.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.server.persistence.enabled }}
            # itzg's PERSISTENT data root is /data — worlds, plugins,
            # configs, ops.json, cache, logs all live there.
            - name: data
              mountPath: /data
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 120
            periodSeconds: 20
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.server.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ .Values.server.persistence.accessModes }}
        {{- with .Values.server.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.server.persistence.size }}
  {{- end }}
