name: Build & push container images

# Pushes leafypaper-master + leafypaper-server images to GitHub Container
# Registry on every push to main. The Helm chart in `charts/leafypaper`
# references these images by their :latest tag with imagePullPolicy: Always
# so a freshly-built image goes live the next time a pod restarts.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/leafdtk/leafypaper

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'gradle' }

      - name: Configure git for paperweight
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name  "Github Actions"

      - name: Apply patches
        run: ./gradlew applyPatches --stacktrace

      - name: Build master shadowjar
        run: ./gradlew :MultiPaper-Master:shadowJar --no-parallel --stacktrace

      - name: Stage jar into docker context
        run: |
          mkdir -p docker/master
          cp MultiPaper-Master/build/libs/multipaper-master-*-all.jar docker/master/multipaper-master.jar

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push master image
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/master.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-master:latest
            ${{ env.IMAGE_PREFIX }}-master:${{ github.sha }}

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'gradle' }

      - name: Configure git for paperweight
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name  "Github Actions"

      - name: Apply patches
        run: ./gradlew applyPatches --stacktrace

      - name: Build paperclip jar
        run: ./gradlew shadowjar createReobfPaperclipJar --no-parallel --stacktrace

      - name: Stage jar into docker context
        run: |
          mkdir -p docker/server
          cp build/libs/multipaper-paperclip-*-reobf.jar docker/server/paperclip.jar

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/server.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-server:latest
            ${{ env.IMAGE_PREFIX }}-server:${{ github.sha }}
