name: Publish to GitHub Packages

# Runs on every push to main. Also exposed as a manual workflow_dispatch so
# you can re-run for a specific commit without pushing again.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency: queued but never parallel — Maven publishes that race each
# other can produce inconsistent metadata in GitHub Packages.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # paperweight needs full history for git am

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure git identity for paperweight
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"

      - name: Apply patches
        run: ./gradlew applyPatches --stacktrace

      - name: Build paperclip jar
        run: ./gradlew shadowjar createReobfPaperclipJar --stacktrace

      # Publishes:
      #   puregero.multipaper:multipaper-mastermessagingprotocol
      #   puregero.multipaper:multipaper-master
      #   puregero.multipaper:dev-bundle (root)
      # The paperclip server jar is uploaded as a release asset by a separate
      # step below — paperclip jars don't belong in a Maven repo.
      - name: Publish Maven artifacts to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish --stacktrace

      - name: Upload paperclip jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: leafypaper-paperclip
          path: build/libs/multipaper-paperclip-*-reobf.jar

      - name: Upload MultiPaper-Master jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: leafypaper-master
          path: MultiPaper-Master/build/libs/multipaper-master*.jar
